<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmaVisitas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  :root {
    --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#085041;
    --gray:#888780;--gray-light:#F1EFE8;--border:#D3D1C7;
    --text:#2C2C2A;--text-muted:#5F5E5A;--bg:#F8F7F3;--white:#FFFFFF;
    --danger:#E24B4A;--amber:#BA7517;--amber-light:#FAEEDA;
    --blue:#185FA5;--blue-light:#E6F1FB;--purple:#6B3FA0;--purple-light:#F0EAFA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;}

  /* AUTH */
  #auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;}
  .auth-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem;}
  .logo-icon{width:40px;height:40px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:22px;height:22px;fill:white;}
  .logo-text{font-size:20px;font-weight:600;}
  .logo-sub{font-size:12px;color:var(--text-muted);letter-spacing:.05em;}
  .auth-title{font-size:18px;font-weight:600;margin-bottom:.25rem;}
  .auth-sub{font-size:14px;color:var(--text-muted);margin-bottom:1.5rem;}
  label{display:block;font-size:13px;font-weight:500;color:var(--text-muted);margin-bottom:4px;margin-top:14px;}
  input[type=email],input[type=password],input[type=text],input[type=tel],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:15px;color:var(--text);background:var(--white);outline:none;transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--green);}
  textarea{resize:vertical;min-height:80px;}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--green);color:white;width:100%;padding:12px;margin-top:1.5rem;font-size:15px;border:none;border-radius:8px;font-family:inherit;font-weight:500;cursor:pointer;}
  .btn-primary:hover{opacity:.9;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .error-msg{color:var(--danger);font-size:13px;margin-top:10px;display:none;}

  /* APP */
  #app-screen{display:none;min-height:100vh;flex-direction:column;}
  .topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .topbar-logo{display:flex;align-items:center;gap:8px;}
  .topbar-logo .li{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .topbar-logo .li svg{width:18px;height:18px;fill:white;}
  .topbar-logo span{font-weight:600;font-size:16px;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .user-chip{font-size:13px;color:var(--text-muted);}
  .badge-role{font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;}
  .badge-admin{background:var(--purple-light);color:var(--purple);}
  .badge-gestor{background:var(--amber-light);color:var(--amber);}
  .badge-assessor{background:var(--green-light);color:var(--green-dark);}
  .btn-logout{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px;padding:4px 8px;border-radius:6px;}
  .btn-logout:hover{background:var(--gray-light);}
  .main-content{flex:1;padding:1.5rem 1.25rem;max-width:860px;margin:0 auto;width:100%;}

  /* TABS */
  .tabs{display:flex;gap:4px;margin-bottom:1.5rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .tab{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;white-space:nowrap;}
  .tab.active{color:var(--green);border-bottom-color:var(--green);}

  /* CARDS */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;}
  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  .stat-value{font-size:26px;font-weight:600;}
  .stat-value.green{color:var(--green);}
  .stat-value.amber{color:var(--amber);}
  .progress-bar-wrap{background:var(--border);border-radius:20px;height:6px;margin-bottom:1.25rem;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--green);border-radius:20px;transition:width .4s;}
  .progress-label{font-size:13px;color:var(--text-muted);margin-bottom:4px;}

  /* FILTERS */
  .filter-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
  .filter-row select{width:auto;flex:1;min-width:130px;}
  .filter-row input{flex:2;min-width:160px;}

  /* TABLE */
  .table-wrap{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;overflow-x:auto;}
  .vtable{width:100%;border-collapse:collapse;font-size:14px;}
  .vtable th{text-align:left;padding:8px 12px;color:var(--text-muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap;}
  .vtable td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .vtable tr:last-child td{border-bottom:none;}
  .vtable tr:hover td{background:var(--gray-light);}

  /* PILLS */
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:500;}
  .pill-done{background:var(--green-light);color:var(--green-dark);}
  .pill-pending{background:var(--gray-light);color:var(--gray);}
  .pill-tet{background:var(--blue-light);color:var(--blue);}
  .pill-admin{background:var(--purple-light);color:var(--purple);}

  /* CONFIG */
  .config-area{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
  .config-title{font-size:15px;font-weight:600;margin-bottom:.5rem;}
  .config-hint{font-size:13px;color:var(--text-muted);margin-bottom:.75rem;line-height:1.6;}
  .btn-config{background:var(--green);color:white;padding:10px 18px;border-radius:8px;border:none;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;}
  .btn-config:hover{opacity:.9;}
  .btn-danger{background:var(--danger);color:white;padding:7px 14px;border-radius:8px;border:none;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;}
  .btn-export{background:var(--green);color:white;border:none;border-radius:8px;padding:10px 16px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;}

  /* TET CARDS */
  .tet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:1rem;}
  .tet-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .tet-card-name{font-weight:600;font-size:15px;margin-bottom:4px;}
  .tet-card-meta{font-size:13px;color:var(--text-muted);margin-bottom:8px;}
  .tet-card-stats{display:flex;gap:8px;flex-wrap:wrap;}

  /* CLIENT LIST */
  .client-list{display:flex;flex-direction:column;gap:8px;}
  .client-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color .15s;}
  .client-card:hover{border-color:var(--green);}
  .client-card.done{border-left:3px solid var(--green);}
  .client-name{font-weight:500;font-size:15px;}
  .client-meta{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-left:12px;}
  .dot-p{background:var(--border);}
  .dot-d{background:var(--green);}

  /* DETAIL */
  .back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:14px;background:none;border:none;cursor:pointer;margin-bottom:1.25rem;padding:0;}
  .back-btn:hover{color:var(--text);}
  .detail-name{font-size:22px;font-weight:600;}
  .detail-info{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:8px 0 1.5rem;display:flex;flex-direction:column;gap:6px;}
  .detail-info-row{display:flex;align-items:flex-start;gap:8px;font-size:14px;}
  .detail-info-label{font-weight:500;color:var(--text-muted);min-width:70px;font-size:13px;}
  .form-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;}
  .size-btn{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--white);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--text-muted);}
  .size-btn:hover{border-color:var(--green);color:var(--green);}
  .size-btn.sel{background:var(--green-light);border-color:var(--green);color:var(--green-dark);}
  .option-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .opt-btn{padding:8px 14px;border:1px solid var(--border);border-radius:20px;background:var(--white);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--text-muted);}
  .opt-btn:hover{border-color:var(--green);color:var(--green);}
  .opt-btn.sel{background:var(--green-light);border-color:var(--green);color:var(--green-dark);}
  .btn-save{background:var(--green);color:white;width:100%;padding:13px;font-size:15px;margin-top:.5rem;border-radius:10px;border:none;font-family:inherit;font-weight:500;cursor:pointer;}
  .saved-badge{display:none;align-items:center;gap:6px;color:var(--green);font-size:14px;font-weight:500;background:var(--green-light);padding:8px 14px;border-radius:8px;margin-top:8px;}

  /* SPINNER */
  .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-full{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:15px;}
  .status-msg{font-size:13px;margin-top:8px;min-height:18px;}
</style>
</head>
<body>

<div id="loading-screen" class="loading-full">
  <div class="spinner" style="border-color:var(--border);border-top-color:var(--green);width:32px;height:32px;border-width:3px;"></div>
</div>

<div id="auth-screen" style="display:none;">
  <div class="auth-card">
    <div class="logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 3.18 2.07 5.85 5 6.74V20h4v-4.26c2.93-.89 5-3.56 5-6.74 0-3.87-3.13-7-7-7zm0 11c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg></div>
      <div><div class="logo-text">FarmaVisitas</div><div class="logo-sub">GESTÃO DE VISITAS</div></div>
    </div>
    <div class="auth-title">Entrar</div>
    <div class="auth-sub">Use seu e-mail e senha cadastrados.</div>
    <label>E-mail</label><input type="email" id="auth-email" placeholder="seu@email.com"/>
    <label>Senha</label><input type="password" id="auth-pass" placeholder="••••••••"/>
    <div class="error-msg" id="auth-error"></div>
    <button class="btn-primary" onclick="doLogin()" id="btn-login">Entrar</button>
  </div>
</div>

<div id="app-screen" style="display:none;flex-direction:column;">
  <div class="topbar">
    <div class="topbar-logo">
      <div class="li"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 3.18 2.07 5.85 5 6.74V20h4v-4.26c2.93-.89 5-3.56 5-6.74 0-3.87-3.13-7-7-7zm0 11c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg></div>
      <span>FarmaVisitas</span>
    </div>
    <div class="topbar-right">
      <span class="user-chip" id="topbar-user"></span>
      <span class="badge-role" id="topbar-role"></span>
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>
  </div>
  <div class="main-content" id="main-content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDm6m6ESUBFs1meqaPoumhnUCnl2rg6LCU",authDomain:"map-farma-4faf1.firebaseapp.com",projectId:"map-farma-4faf1",storageBucket:"map-farma-4faf1.firebasestorage.app",messagingSenderId:"617219254183",appId:"1:617219254183:web:d2d76d80c529f853e63882"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let currentUser=null, currentRole=null;
let allClients=[], allVisits={}, allAssessores=[], allTets=[];

// ===================== AUTH =====================
auth.onAuthStateChanged(async user=>{
  document.getElementById('loading-screen').style.display='none';
  if(user){
    currentUser=user;
    const snap=await db.collection('usuarios').doc(user.uid).get();
    if(snap.exists){
      const data=snap.data(); currentRole=data.role;
      document.getElementById('topbar-user').textContent=data.nome||user.email;
      const re=document.getElementById('topbar-role');
      re.textContent=currentRole==='admin'?'Admin':currentRole==='gestor'?'Gestor':'Assessor';
      re.className='badge-role badge-'+currentRole;
      document.getElementById('auth-screen').style.display='none';
      document.getElementById('app-screen').style.display='flex';
      await loadData();
      if(currentRole==='admin') renderAdmin();
      else if(currentRole==='gestor') renderGestor();
      else renderAssessorList();
    } else { auth.signOut(); showAE('Usuário não encontrado.'); }
  } else {
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app-screen').style.display='none';
  }
});

async function doLogin(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const btn=document.getElementById('btn-login');
  if(!email||!pass) return showAE('Preencha e-mail e senha.');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Entrando...'; hideAE();
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ showAE('E-mail ou senha incorretos.'); btn.disabled=false; btn.textContent='Entrar'; }
}
function doLogout(){ auth.signOut(); }
function showAE(m){ const e=document.getElementById('auth-error'); e.textContent=m; e.style.display='block'; }
function hideAE(){ document.getElementById('auth-error').style.display='none'; }

// ===================== LOAD DATA =====================
async function loadData(){
  const [cs,vs,us,ts]=await Promise.all([
    db.collection('clientes').orderBy('nome').get(),
    db.collection('visitas').get(),
    db.collection('usuarios').where('role','in',['assessor','gestor']).get(),
    db.collection('tets').get()
  ]);
  allClients=cs.docs.map(d=>({id:d.id,...d.data()}));
  allVisits={};
  vs.docs.forEach(d=>{ const dt=d.data(); allVisits[dt.clienteId]={id:d.id,...dt}; });
  allAssessores=us.docs.map(d=>({uid:d.id,...d.data()})).filter(u=>u.role==='assessor');
  allTets=ts.docs.map(d=>({id:d.id,...d.data()}));
}

// ===================== ADMIN =====================
function renderAdmin(){
  document.getElementById('main-content').innerHTML=`
    <div class="tabs">
      <button class="tab active" id="tab-tets" onclick="switchAdminTab('tets')">TETs</button>
      <button class="tab" id="tab-assessores" onclick="switchAdminTab('assessores')">Assessores</button>
      <button class="tab" id="tab-atribuir" onclick="switchAdminTab('atribuir')">Atribuir TET</button>
    </div>
    <div id="tab-content"></div>`;
  renderAdminTets();
}

function switchAdminTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='tets') renderAdminTets();
  else if(tab==='assessores') renderAdminAssessores();
  else renderAdminAtribuir();
}

// ---- TETS ----
function renderAdminTets(){
  const tetOpts=allTets.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('');
  document.getElementById('tab-content').innerHTML=`
    <div class="config-area">
      <div class="config-title">Criar novo TET</div>
      <div class="config-hint">Um TET (Território) é uma carteira de clientes que será atribuída a um assessor.</div>
      <label>Nome do TET</label><input type="text" id="tet-nome" placeholder="Ex: Osasco Centro, Osasco Oeste..."/>
      <label>Cidade</label><input type="text" id="tet-cidade" placeholder="Ex: Osasco"/>
      <label>Descrição (opcional)</label><input type="text" id="tet-desc" placeholder="Observações sobre o território"/>
      <button class="btn-config" onclick="createTet()">Criar TET</button>
      <div id="tet-status" class="status-msg"></div>
    </div>

    <div class="config-area">
      <div class="config-title">Importar clientes para um TET (CSV)</div>
      <div class="config-hint">Colunas: <strong>codigo, nome, endereco, bairro, cidade, uf, cep, rede</strong><br>Separador vírgula ou ponto e vírgula. Os clientes serão adicionados ao TET selecionado.</div>
      <label>Selecionar TET</label>
      <select id="import-tet-select"><option value="">-- Selecione o TET --</option>${tetOpts}</select>
      <input type="file" id="csv-file" accept=".csv" style="margin-top:10px" onchange="previewCSV()"/>
      <div id="csv-preview" style="margin-top:10px"></div>
      <div id="csv-status" class="status-msg"></div>
    </div>

    <div class="config-area">
      <div class="config-title">TETs cadastrados (${allTets.length})</div>
      <div class="tet-grid">
        ${allTets.length ? allTets.map(t=>{
          const clients=allClients.filter(c=>c.tetId===t.id);
          const done=clients.filter(c=>allVisits[c.id]).length;
          const assessor=allAssessores.find(a=>a.uid===t.assessorUid);
          return`<div class="tet-card">
            <div class="tet-card-name">${t.nome}</div>
            <div class="tet-card-meta">${t.cidade||''} ${t.desc?'· '+t.desc:''}</div>
            <div class="tet-card-stats">
              <span class="pill pill-tet">${clients.length} clientes</span>
              <span class="pill pill-done">${done} visitados</span>
              ${assessor?`<span class="pill" style="background:var(--amber-light);color:var(--amber)">${assessor.nome}</span>`:'<span class="pill pill-pending">Sem assessor</span>'}
            </div>
          </div>`;
        }).join('') : '<div style="color:var(--text-muted);font-size:14px">Nenhum TET criado ainda.</div>'}
      </div>
    </div>`;
}

async function createTet(){
  const nome=document.getElementById('tet-nome').value.trim();
  const cidade=document.getElementById('tet-cidade').value.trim();
  const desc=document.getElementById('tet-desc').value.trim();
  const st=document.getElementById('tet-status');
  if(!nome) return st.innerHTML='<span style="color:var(--danger)">Informe o nome do TET.</span>';
  st.innerHTML='<span style="color:var(--text-muted)">Criando...</span>';
  try{
    const ref=await db.collection('tets').add({nome,cidade,desc,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    allTets.push({id:ref.id,nome,cidade,desc});
    st.innerHTML=`<span style="color:var(--green)">✓ TET <strong>${nome}</strong> criado!</span>`;
    document.getElementById('tet-nome').value='';
    document.getElementById('tet-cidade').value='';
    document.getElementById('tet-desc').value='';
    renderAdminTets();
  } catch(e){ st.innerHTML=`<span style="color:var(--danger)">Erro: ${e.message}</span>`; }
}

function previewCSV(){
  const file=document.getElementById('csv-file').files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result;
    const sep=text.includes(';')?';':',';
    const lines=text.trim().split('\n');
    const headers=lines[0].split(sep).map(h=>h.trim().toLowerCase().replace(/"/g,''));
    const rows=lines.slice(1).map(l=>{
      const vals=l.split(sep);
      const obj={};
      headers.forEach((h,i)=>obj[h]=(vals[i]||'').trim().replace(/"/g,''));
      return obj;
    }).filter(r=>r.nome);
    document.getElementById('csv-preview').innerHTML=`
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:8px">${rows.length} clientes encontrados</p>
      <button class="btn-config" onclick='importCSV(${JSON.stringify(rows).replace(/'/g,"&#39;")})'>Importar ${rows.length} clientes</button>`;
  };
  reader.readAsText(file);
}

async function importCSV(rows){
  const tetId=document.getElementById('import-tet-select').value;
  if(!tetId) return alert('Selecione um TET antes de importar.');
  if(!confirm(`Importar ${rows.length} clientes para este TET?`)) return;
  const status=document.getElementById('csv-status');
  status.innerHTML='<span style="color:var(--text-muted)">Importando...</span>';
  try{
    for(let i=0;i<rows.length;i+=400){
      const batch=db.batch();
      rows.slice(i,i+400).forEach(r=>{
        batch.set(db.collection('clientes').doc(),{
          codigo:r.codigo||'', nome:r.nome||'', endereco:r.endereco||'',
          bairro:r.bairro||'', cidade:r.cidade||'', uf:(r.uf||'').toUpperCase(),
          cep:r.cep||'', rede:r.rede||'', tetId,
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
      });
      await batch.commit();
    }
    await loadData();
    status.innerHTML=`<span style="color:var(--green)">✓ ${rows.length} clientes importados!</span>`;
    renderAdminTets();
  } catch(e){ status.innerHTML=`<span style="color:var(--danger)">Erro: ${e.message}</span>`; }
}

// ---- ASSESSORES ----
function renderAdminAssessores(){
  document.getElementById('tab-content').innerHTML=`
    <div class="config-area">
      <div class="config-title">Cadastrar novo assessor</div>
      <label>Nome</label><input type="text" id="nn" placeholder="Nome completo"/>
      <label>E-mail</label><input type="email" id="ne" placeholder="assessor@email.com"/>
      <label>Senha inicial</label><input type="password" id="np" placeholder="mínimo 6 caracteres"/>
      <button class="btn-config" onclick="createAssessor()">Cadastrar assessor</button>
      <div id="cs" class="status-msg"></div>
    </div>
    <div class="config-area">
      <div class="config-title">Assessores cadastrados (${allAssessores.length})</div>
      ${allAssessores.length ? allAssessores.map(a=>{
        const tet=allTets.find(t=>t.assessorUid===a.uid);
        const total=allClients.filter(c=>c.tetId===(tet?.id)).length;
        const done=allClients.filter(c=>c.tetId===(tet?.id)&&allVisits[c.id]).length;
        return`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:500">${a.nome}</div><div style="font-size:13px;color:var(--text-muted)">${a.email}</div></div>
          <div style="display:flex;gap:6px;align-items:center">
            ${tet?`<span class="pill pill-tet">${tet.nome}</span><span class="pill pill-done">${done}/${total}</span>`:'<span class="pill pill-pending">Sem TET</span>'}
          </div>
        </div>`;
      }).join('') : '<div style="color:var(--text-muted);font-size:14px">Nenhum assessor cadastrado.</div>'}
    </div>`;
}

async function createAssessor(){
  const nome=document.getElementById('nn').value.trim();
  const email=document.getElementById('ne').value.trim();
  const pass=document.getElementById('np').value;
  const st=document.getElementById('cs');
  if(!nome||!email||!pass){st.innerHTML='<span style="color:var(--danger)">Preencha todos os campos.</span>';return;}
  if(pass.length<6){st.innerHTML='<span style="color:var(--danger)">Senha mínima: 6 caracteres.</span>';return;}
  st.innerHTML='<span style="color:var(--text-muted)">Criando...</span>';
  try{
    const sec=firebase.initializeApp(firebase.app().options,'sec_'+Date.now());
    const sa=sec.auth();
    const cr=await sa.createUserWithEmailAndPassword(email,pass);
    const uid=cr.user.uid;
    await sa.signOut(); await sec.delete();
    await db.collection('usuarios').doc(uid).set({nome,email,role:'assessor',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    allAssessores.push({uid,nome,email,role:'assessor'});
    st.innerHTML=`<span style="color:var(--green)">✓ Assessor <strong>${nome}</strong> cadastrado!</span>`;
    document.getElementById('nn').value=''; document.getElementById('ne').value=''; document.getElementById('np').value='';
    renderAdminAssessores();
  } catch(e){ st.innerHTML=`<span style="color:var(--danger)">Erro: ${e.message}</span>`; }
}

// ---- ATRIBUIR TET ----
function renderAdminAtribuir(){
  const tetOpts='<option value="">-- Selecione o TET --</option>'+allTets.map(t=>`<option value="${t.id}">${t.nome} ${t.cidade?'('+t.cidade+')':''}</option>`).join('');
  const assessorOpts='<option value="">-- Selecione o assessor --</option>'+allAssessores.map(a=>`<option value="${a.uid}">${a.nome}</option>`).join('');

  document.getElementById('tab-content').innerHTML=`
    <div class="config-area">
      <div class="config-title">Atribuir TET a um assessor</div>
      <div class="config-hint">O assessor verá apenas os clientes do TET atribuído a ele.</div>
      <label>TET</label><select id="at-tet">${tetOpts}</select>
      <label>Assessor</label><select id="at-assessor">${assessorOpts}</select>
      <button class="btn-config" onclick="atribuirTet()">Atribuir</button>
      <div id="at-status" class="status-msg"></div>
    </div>

    <div class="config-area">
      <div class="config-title">Atribuições atuais</div>
      <div class="table-wrap"><table class="vtable">
        <thead><tr><th>TET</th><th>Cidade</th><th>Assessor</th><th>Clientes</th><th>Visitados</th></tr></thead>
        <tbody>
          ${allTets.map(t=>{
            const assessor=allAssessores.find(a=>a.uid===t.assessorUid);
            const clients=allClients.filter(c=>c.tetId===t.id);
            const done=clients.filter(c=>allVisits[c.id]).length;
            return`<tr>
              <td><strong>${t.nome}</strong></td>
              <td style="color:var(--text-muted)">${t.cidade||'—'}</td>
              <td>${assessor?assessor.nome:'<span style="color:var(--text-muted)">Não atribuído</span>'}</td>
              <td>${clients.length}</td>
              <td><span class="pill pill-done">${done}</span></td>
            </tr>`;
          }).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:2rem">Nenhum TET criado</td></tr>'}
        </tbody>
      </table></div>
    </div>`;
}

async function atribuirTet(){
  const tetId=document.getElementById('at-tet').value;
  const assessorUid=document.getElementById('at-assessor').value;
  const st=document.getElementById('at-status');
  if(!tetId||!assessorUid) return st.innerHTML='<span style="color:var(--danger)">Selecione o TET e o assessor.</span>';
  st.innerHTML='<span style="color:var(--text-muted)">Atribuindo...</span>';
  try{
    await db.collection('tets').doc(tetId).update({assessorUid});
    const tet=allTets.find(t=>t.id===tetId);
    if(tet) tet.assessorUid=assessorUid;

    // Update all clients in this TET
    const clients=allClients.filter(c=>c.tetId===tetId);
    for(let i=0;i<clients.length;i+=400){
      const batch=db.batch();
      clients.slice(i,i+400).forEach(c=>{ batch.update(db.collection('clientes').doc(c.id),{assessorUid}); c.assessorUid=assessorUid; });
      await batch.commit();
    }
    const an=(allAssessores.find(a=>a.uid===assessorUid)||{}).nome||'';
    const tn=tet?.nome||'';
    st.innerHTML=`<span style="color:var(--green)">✓ TET <strong>${tn}</strong> atribuído a <strong>${an}</strong>!</span>`;
    renderAdminAtribuir();
  } catch(e){ st.innerHTML=`<span style="color:var(--danger)">Erro: ${e.message}</span>`; }
}

// ===================== GESTOR =====================
function renderGestor(){
  document.getElementById('main-content').innerHTML=`
    <div class="tabs">
      <button class="tab active" id="tab-painel" onclick="switchGestorTab('painel')">Painel</button>
      <button class="tab" id="tab-tets-g" onclick="switchGestorTab('tets')">TETs</button>
    </div>
    <div id="tab-content"></div>`;
  renderGestorPainel();
}

function switchGestorTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+(tab==='tets'?'tets-g':tab)).classList.add('active');
  if(tab==='painel') renderGestorPainel();
  else renderGestorTets();
}

function renderGestorPainel(){
  const ufs=[...new Set(allClients.map(c=>c.uf).filter(Boolean))].sort();
  const ufOpts='<option value="">Todas as UFs</option>'+ufs.map(u=>`<option value="${u}">${u}</option>`).join('');
  const aOpts='<option value="">Todos os assessores</option>'+allAssessores.map(a=>`<option value="${a.uid}">${a.nome}</option>`).join('');
  const tetOpts='<option value="">Todos os TETs</option>'+allTets.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('');

  document.getElementById('tab-content').innerHTML=`
    <div style="background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem;">
      <p style="font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem">Filtrar resumo</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="f-uf" onchange="updateSummary()" style="flex:1;min-width:120px">${ufOpts}</select>
        <select id="f-assessor-sum" onchange="updateSummary()" style="flex:1;min-width:160px">${aOpts}</select>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value" id="sum-total">0</div></div>
      <div class="stat-card"><div class="stat-label">Visitados</div><div class="stat-value green" id="sum-done">0</div></div>
      <div class="stat-card"><div class="stat-label">Pendentes</div><div class="stat-value amber" id="sum-pending">0</div></div>
    </div>
    <p class="progress-label" id="sum-pct">0% concluído</p>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="sum-bar" style="width:0%"></div></div>
    <div class="filter-row" style="margin-top:1.5rem">
      <input type="text" id="s-search" placeholder="Buscar farmácia..." oninput="filterGestor()"/>
      <select id="s-tet" onchange="filterGestor()">${tetOpts}</select>
      <select id="s-assessor" onchange="filterGestor()">${aOpts}</select>
      <select id="s-status" onchange="filterGestor()"><option value="">Todos os status</option><option value="done">Visitados</option><option value="pending">Pendentes</option></select>
      <button class="btn-export" onclick="exportExcel()">⬇ Exportar</button>
    </div>
    <div class="table-wrap"><table class="vtable">
      <thead><tr><th>Farmácia</th><th>TET</th><th>Assessor</th><th>Responsável</th><th>Porte</th><th>Visita RCA</th><th>Online</th><th>Status</th></tr></thead>
      <tbody id="gtbody">${buildGestorRows(allClients)}</tbody>
    </table></div>`;
  updateSummary();
}

function updateSummary(){
  const uf=document.getElementById('f-uf')?.value||'';
  const assessor=document.getElementById('f-assessor-sum')?.value||'';
  const filtered=allClients.filter(c=>{
    if(uf&&(c.uf||'')!==uf) return false;
    if(assessor&&c.assessorUid!==assessor) return false;
    return true;
  });
  const total=filtered.length;
  const done=filtered.filter(c=>allVisits[c.id]).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('sum-total').textContent=total;
  document.getElementById('sum-done').textContent=done;
  document.getElementById('sum-pending').textContent=total-done;
  document.getElementById('sum-pct').textContent=`${pct}% concluído`;
  document.getElementById('sum-bar').style.width=`${pct}%`;
}

function buildGestorRows(clients){
  if(!clients.length) return '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:2rem">Nenhum resultado</td></tr>';
  return clients.map(c=>{
    const v=allVisits[c.id];
    const an=c.assessorUid?(allAssessores.find(a=>a.uid===c.assessorUid)||{}).nome||'—':'—';
    const tet=c.tetId?(allTets.find(t=>t.id===c.tetId)||{}).nome||'—':'—';
    return`<tr>
      <td><strong>${c.nome}</strong><br><span style="color:var(--text-muted);font-size:12px">${c.bairro||''} ${c.uf?'· '+c.uf:''}</span></td>
      <td><span class="pill pill-tet">${tet}</span></td>
      <td>${an}</td>
      <td>${v?v.responsavel||'—':'—'}</td>
      <td>${v?v.porte||'—':'—'}</td>
      <td style="font-size:13px">${v?v.visitaRca||'—':'—'}</td>
      <td style="font-size:13px">${v?v.acessoOnline||'—':'—'}</td>
      <td><span class="pill ${v?'pill-done':'pill-pending'}">${v?'Visitado':'Pendente'}</span></td>
    </tr>`;
  }).join('');
}

function filterGestor(){
  const s=(document.getElementById('s-search')?.value||'').toLowerCase();
  const tf=document.getElementById('s-tet')?.value||'';
  const af=document.getElementById('s-assessor')?.value||'';
  const sf=document.getElementById('s-status')?.value||'';
  const f=allClients.filter(c=>{
    if(s&&!c.nome.toLowerCase().includes(s)) return false;
    if(tf&&c.tetId!==tf) return false;
    if(af&&c.assessorUid!==af) return false;
    const v=allVisits[c.id];
    if(sf==='done'&&!v) return false;
    if(sf==='pending'&&v) return false;
    return true;
  });
  document.getElementById('gtbody').innerHTML=buildGestorRows(f);
}

function renderGestorTets(){
  document.getElementById('tab-content').innerHTML=`
    <div class="tet-grid">
      ${allTets.length ? allTets.map(t=>{
        const clients=allClients.filter(c=>c.tetId===t.id);
        const done=clients.filter(c=>allVisits[c.id]).length;
        const pct=clients.length?Math.round(done/clients.length*100):0;
        const assessor=allAssessores.find(a=>a.uid===t.assessorUid);
        return`<div class="tet-card">
          <div class="tet-card-name">${t.nome}</div>
          <div class="tet-card-meta">${t.cidade||''}</div>
          <div style="margin:8px 0">
            <div class="progress-label">${pct}% · ${done}/${clients.length}</div>
            <div class="progress-bar-wrap" style="margin-bottom:0"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="tet-card-stats">
            ${assessor?`<span class="pill" style="background:var(--amber-light);color:var(--amber)">${assessor.nome}</span>`:'<span class="pill pill-pending">Sem assessor</span>'}
          </div>
        </div>`;
      }).join('') : '<div class="empty-state">Nenhum TET cadastrado ainda.</div>'}
    </div>`;
}

function exportExcel(){
  const rows=[['Código','Farmácia','Endereço','Bairro','Cidade','UF','CEP','Rede','TET','Assessor','Responsável','Telefone','Porte','Visita RCA','Acesso Online','Observações','Status','Data visita']];
  allClients.forEach(c=>{
    const v=allVisits[c.id];
    const an=c.assessorUid?(allAssessores.find(a=>a.uid===c.assessorUid)||{}).nome||'':'';
    const tet=c.tetId?(allTets.find(t=>t.id===c.tetId)||{}).nome||'':'';
    const dt=v&&v.updatedAt?new Date(v.updatedAt.seconds*1000).toLocaleDateString('pt-BR'):'';
    rows.push([c.codigo||'',c.nome||'',c.endereco||'',c.bairro||'',c.cidade||'',c.uf||'',c.cep||'',c.rede||'',
      tet,an,v?v.responsavel||'':'',v?v.telefone||'':'',v?v.porte||'':'',
      v?v.visitaRca||'':'',v?v.acessoOnline||'':'',v?v.obs||'':'',v?'Visitado':'Pendente',dt]);
  });
  const ws=rows.map(r=>r.map(c=>{const s=String(c);return s.includes(',')||s.includes('"')?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+ws],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`farmavisitas_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

// ===================== ASSESSOR =====================
function renderAssessorList(){
  const my=allClients.filter(c=>c.assessorUid===currentUser.uid);
  const done=my.filter(c=>allVisits[c.id]).length;
  const total=my.length;
  const pct=total?Math.round(done/total*100):0;
  const tet=my.length?(allTets.find(t=>t.id===my[0].tetId)||{}).nome||'—':'—';
  window._myClients=my;
  document.getElementById('main-content').innerHTML=`
    <div style="margin-bottom:1rem">
      <p style="font-weight:600;font-size:16px">Meu Território — <span class="pill pill-tet">${tet}</span></p>
      <p class="progress-label" style="margin-top:.75rem">${done} de ${total} farmácias visitadas</p>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div style="margin-bottom:.75rem"><input type="text" placeholder="Buscar farmácia..." oninput="filterAL(this.value)"/></div>
    <div class="client-list" id="al">${renderALHTML(my)}</div>`;
}

function renderALHTML(clients){
  if(!clients.length) return '<div class="empty-state">Nenhuma farmácia atribuída a você ainda.<br>Aguarde o admin fazer a distribuição.</div>';
  return clients.map(c=>{
    const v=allVisits[c.id];
    const meta=v?`${v.responsavel||''} · Porte ${v.porte||'?'}`:c.bairro||c.cidade||'';
    return`<div class="client-card ${v?'done':''}" onclick="openClient('${c.id}')">
      <div><div class="client-name">${c.nome}</div><div class="client-meta">${meta}</div></div>
      <div class="sdot ${v?'dot-d':'dot-p'}"></div>
    </div>`;
  }).join('');
}

function filterAL(s){
  const f=(window._myClients||[]).filter(c=>c.nome.toLowerCase().includes(s.toLowerCase()));
  document.getElementById('al').innerHTML=renderALHTML(f);
}

function openClient(id){
  const c=allClients.find(x=>x.id===id), v=allVisits[id]||{};
  window._selectedSize=v.porte||null;
  window._selectedRca=v.visitaRca||null;
  window._selectedOnline=v.acessoOnline||null;
  const rcaOpts=['Visita semanal','Visita por quinzena','Visita mensal','Não conhece o RCA','Somente WhatsApp'];
  const onlineOpts=['Site','Televendas app','Não tem'];
  document.getElementById('main-content').innerHTML=`
    <button class="back-btn" onclick="renderAssessorList()">← Voltar</button>
    <div class="detail-name">${c.nome}</div>
    <div class="detail-info">
      ${c.codigo?`<div class="detail-info-row"><span class="detail-info-label">Código</span><span>${c.codigo}</span></div>`:''}
      ${c.endereco?`<div class="detail-info-row"><span class="detail-info-label">Endereço</span><span>${c.endereco}</span></div>`:''}
      <div class="detail-info-row"><span class="detail-info-label">Bairro</span><span>${c.bairro||'—'} ${c.cidade?'· '+c.cidade:''} ${c.uf?'· '+c.uf:''}</span></div>
      ${c.cep?`<div class="detail-info-row"><span class="detail-info-label">CEP</span><span>${c.cep}</span></div>`:''}
      ${c.rede?`<div class="detail-info-row"><span class="detail-info-label">Rede</span><span>${c.rede}</span></div>`:''}
    </div>
    <div class="form-card">
      <div class="form-row">
        <div><label>Nome do responsável</label><input type="text" id="fr" placeholder="Ex: João Silva" value="${v.responsavel||''}"/></div>
        <div><label>Telefone</label><input type="tel" id="ft" placeholder="(11) 99999-9999" value="${v.telefone||''}"/></div>
      </div>
      <label>Tamanho da loja</label>
      <div class="size-grid">${['P','M','G','GG'].map(s=>`<button class="size-btn ${v.porte===s?'sel':''}" onclick="selSz(this,'${s}')">${s}</button>`).join('')}</div>
      <label>Recebe visita do RCA?</label>
      <div class="option-grid">${rcaOpts.map(o=>`<button class="opt-btn ${v.visitaRca===o?'sel':''}" onclick="selOpt(this,'rca','${o}')">${o}</button>`).join('')}</div>
      <label>Acesso online?</label>
      <div class="option-grid">${onlineOpts.map(o=>`<button class="opt-btn ${v.acessoOnline===o?'sel':''}" onclick="selOpt(this,'online','${o}')">${o}</button>`).join('')}</div>
      <label>Observações</label>
      <textarea id="fo" placeholder="Anotações sobre a visita...">${v.obs||''}</textarea>
    </div>
    <button class="btn-save" id="bsave" onclick="saveVisit('${id}')">Salvar visita</button>
    <div class="saved-badge" id="sbadge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      Salvo com sucesso
    </div>`;
}

function selSz(el,s){ window._selectedSize=s; document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('sel')); el.classList.add('sel'); }
function selOpt(el,type,val){
  if(type==='rca') window._selectedRca=val; else window._selectedOnline=val;
  el.parentElement.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}

async function saveVisit(clienteId){
  const responsavel=document.getElementById('fr').value.trim();
  const telefone=document.getElementById('ft').value.trim();
  const porte=window._selectedSize||null;
  const visitaRca=window._selectedRca||null;
  const acessoOnline=window._selectedOnline||null;
  const obs=document.getElementById('fo').value.trim();
  const btn=document.getElementById('bsave');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Salvando...';
  const data={clienteId,assessorUid:currentUser.uid,assessorEmail:currentUser.email,responsavel,telefone,porte,visitaRca,acessoOnline,obs,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  try{
    if(allVisits[clienteId]){ await db.collection('visitas').doc(allVisits[clienteId].id).update(data); }
    else{ data.createdAt=firebase.firestore.FieldValue.serverTimestamp(); const r=await db.collection('visitas').add(data); allVisits[clienteId]={id:r.id,...data}; }
    allVisits[clienteId]={...allVisits[clienteId],...data};
    btn.disabled=false; btn.textContent='Salvar visita';
    const b=document.getElementById('sbadge'); b.style.display='flex';
    setTimeout(()=>b.style.display='none',2500);
  } catch(e){ alert('Erro: '+e.message); btn.disabled=false; btn.textContent='Salvar visita'; }
}

document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&document.getElementById('auth-screen')?.style.display!=='none') doLogin(); });
</script>
